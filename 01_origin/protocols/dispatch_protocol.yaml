# TSO Dispatch Protocol v1
# 작성: AR Manager | 날짜: 2026-03-27 | 승인: TSO 요청
#
# 목적: Secretary가 Worker에게 작업을 위임할 때
#       맥락·컨텍스트·TSO 의중을 구조적으로 전달하기 위한 명세.
#       매번 자연어를 재조합하는 비효율 제거.
#
# 사용법: Secretary는 아래 템플릿을 채워서 Worker tmux 창에 붙여넣는다.

# ═══════════════════════════════════════════════════════
# 1. DISPATCH 패킷 표준 구조
# ═══════════════════════════════════════════════════════

dispatch_packet_schema:

  # ── 헤더 ──
  id: "DISP-{session_id}-{seq:03d}"  # e.g. DISP-016-001
  timestamp: "YYYY-MM-DD"
  from: "secretary | ar-manager | worker-{name}"  # 발신 주체
  to: "worker-{name}"
  priority: "urgent | normal | low"
  project: "system-infra | research-ens | stock-sentinel | qa-verification | org-process | growth-marketing | vibe-creative | misc"
  context_level: "C0 | C1 | C2"     # 아래 섹션 2 참고

  # ── 발령 출처 (v1.2 추가) ──
  issued_by:
    origin: "tso_direct | secretary_relay | ar_manager_auto | worker_to_worker"
    # tso_direct      : TSO가 직접 지시. Secretary가 원문 그대로 전달.
    # secretary_relay : TSO 발언을 Secretary가 해석·구조화하여 전달.
    # ar_manager_auto : AR Manager가 TSO 개입 없이 자율 판단으로 발령.
    # worker_to_worker: Worker가 다른 Worker에게 직접 요청.
    tso_verbatim: "{TSO 원문 — tso_direct/secretary_relay 시 필수, 없으면 생략}"
    authority_note: "{자율 판단 근거 — ar_manager_auto 시 필수. 예: 'CLAUDE.md 자율 범위 내'}"

  # ── 작업 정의 ──
  task:
    type: "implement | fix | review | research | write | deploy | qa | data"
    title: "한 줄 요약 (동사로 시작)"
    size: "S | M | L | XL"  # v1.8 추가. 아래 §16 참조.
    model_tier: null  # v1.9 추가. 아래 §17 참조. "opus" | "sonnet" | "haiku" | null
    description: |
      구체적인 작업 내용.
      무엇을(What), 어디에(Where), 어떤 방식으로(How — 제약이 있을 때만).
    done_when:
      - "완료 조건 1 (체크 가능한 형태로)"
      - "완료 조건 2"
    out_of_scope:
      - "명시적으로 하지 말 것"  # 생략 가능, 해당 시만

  # ── 시간 추적 (v1.8 추가) ──
  timing:
    started_at: null    # Worker ACK 시점. Worker가 기록.
    completed_at: null  # Worker DONE 시점. Worker가 기록.
    expected_hours: null # size → 시간 자동 매핑. AR Manager가 override 가능.

  # ── 컨텍스트 (레벨에 따라 채우는 필드 다름) ──
  context:
    project_id: "vibe_check | stock_sentinel | branched_cosmos | context_codec | tso_system | other"  # 항상 포함
    project_state: "현재 프로젝트 한 줄 상태"  # 항상 포함
    # C1 이상일 때만:
    decisions_since_last_boot: []
    # C2일 때만:
    snapshot: null

  # ── TSO 의중 ──
  tso_intent:
    explicit: "TSO가 직접 말한 것 — 원문 그대로"  # 없으면 생략
    inferred: "[추론] Secretary가 맥락에서 유추한 것"  # 있으면 [추론] 태그 필수
    priority: "must | should | nice-to-have"
    red_lines: []  # TSO가 명시적으로 금지한 것. 없으면 생략

  # ── 연결 ──
  resources: []   # 참고 파일 경로, 환경변수 위치 등
  blocks: []      # 이 작업 완료 후 unblock되는 것 (선택)
  depends_on: []  # 이 작업이 먼저 필요한 것 (선택)

  # ── 완료 후 체인 (v1.3 추가) ──
  on_complete:
    # 이 dispatch가 완료될 때 자동으로 발령할 다음 dispatch.
    # AR Manager 개입 없이 체인이 자동 진행된다.
    auto_next: null         # dispatch id 또는 null. null이면 체인 없음.
    auto_next_target: null  # 다음 dispatch 대상 Worker
    auto_next_title: null   # 다음 dispatch 한 줄 요약 (AR Manager가 미리 정의)
    condition: "always"     # always | on_success_only


# ═══════════════════════════════════════════════════════
# 2. 컨텍스트 압축 레벨
# ═══════════════════════════════════════════════════════

context_levels:

  C0:
    name: "무컨텍스트"
    when: "Worker가 코드베이스 + CLAUDE.md만으로 작업 전체를 파악할 수 있을 때"
    examples:
      - "특정 버그 수정 (재현 경로 명확)"
      - "단일 파일 수정"
      - "독립적인 신규 기능 (스펙이 자기완결적)"
    secretary_effort: "최소 — task + tso_intent만 채우면 됨"
    fields_required: [task, tso_intent.priority]

  C1:
    name: "델타 컨텍스트"
    when: "이전 세션에서 이어지는 작업. Worker가 부팅된 적 있고, 달라진 것만 알면 됨"
    examples:
      - "이전 dispatch 결과 확인 후 다음 단계"
      - "TSO 결정이 바뀐 후 재작업"
      - "다른 Worker 결과물을 이어받는 작업"
    secretary_effort: "중간 — decisions_since_last_boot 목록 작성"
    fields_required: [task, context.decisions_since_last_boot, tso_intent]
    format_hint: |
      decisions_since_last_boot:
        - "session-016: OAuth 없이 Railway 배포 먼저 진행 (TSO 결정)"
        - "worker-qa 합류 — QA_HANDOFF.md 기준으로 검증 시작"

  C2:
    name: "스냅샷 컨텍스트"
    when: "Worker 신규 온보딩, 또는 3세션 이상 휴식 후 복귀 시"
    examples:
      - "신규 채용 Worker의 첫 번째 dispatch"
      - "HANDOFF 문서를 기반으로 인계받는 Worker"
    secretary_effort: "높음 — 전체 프로젝트 상태 요약 필요"
    fields_required: [task, context.snapshot, tso_intent, resources]
    format_hint: |
      snapshot:
        project: "vibe_check — 익명 진영 토론 플랫폼"
        completed: ["ZK nullifier", "Reputation Engine", "낙관적 투표", ...]
        in_progress: ["Railway 배포"]
        pending: ["Google OAuth"]
        tech_stack: "Next.js 14 / Drizzle ORM / Railway"
        known_issues: []

  C3:
    name: "전체 (비권장)"
    when: "매우 복잡한 판단이 필요할 때만. Secretary가 직접 요약하는 것이 원칙."
    warning: "세션 로그 원문을 그대로 붙여넣는 것은 금지. 반드시 Secretary가 요약."


# ═══════════════════════════════════════════════════════
# 3. TSO 의중 전달 규칙
# ═══════════════════════════════════════════════════════

tso_intent_rules:

  explicit_vs_inferred:
    explicit:
      definition: "TSO가 이번 세션에서 직접 말하거나 승인한 것"
      rule: "원문을 최대한 보존. 요약할 때도 TSO의 단어를 유지."
      format: 'explicit: "OAuth 없이 배포 먼저 진행"'
    inferred:
      definition: "Secretary가 TSO의 말·패턴·결정 히스토리에서 유추한 것"
      rule: "[추론] 태그를 반드시 붙인다. Worker는 추론임을 인지하고 판단."
      format: 'inferred: "[추론] TSO는 빠른 배포를 완성도보다 우선시하는 경향"'

  priority_markers:
    must: "TSO가 명시적으로 요구한 것. Worker는 반드시 준수."
    should: "TSO가 선호하는 방향. 합리적 이유가 있으면 Worker가 달리 판단 가능."
    nice_to_have: "있으면 좋지만 완료 조건에 포함되지 않음."

  red_lines:
    definition: "TSO가 명시적으로 금지하거나 과거에 제지한 것"
    examples:
      - "직접 구현하지 말 것 (Secretary의 경우)"
      - "프로덕션 DB를 건드리지 말 것"
    rule: "red_lines는 Worker가 판단 없이 따른다. Secretary가 임의로 추가 불가."

  intent_decay:
    rule: "TSO 발언 후 2세션 이상 지나면 '구버전 의중'으로 표시"
    format: '[구버전] explicit: "..."'
    note: "구버전 의중은 참고용. 최신 결정과 충돌 시 최신 우선."


# ═══════════════════════════════════════════════════════
# 4. 단축 템플릿 (실제 사용 양식)
# ═══════════════════════════════════════════════════════
#
# Secretary는 아래 템플릿을 복사해서 tmux send-keys로 Worker에게 보낸다.

templates:

  # ── C0: 빠른 단일 작업 ──
  quick_dispatch: |
    [DISPATCH DISP-{session}-{seq}]
    TO: worker-{name}
    FROM: {secretary|ar-manager|worker-{name}}
    ISSUED_BY: {tso_direct|secretary_relay|ar_manager_auto|worker_to_worker}
    PROJECT: {project_id}
    PRIORITY: {urgent|normal|low}

    TASK: {동사로 시작하는 한 줄 요약}

    DESCRIPTION:
    {구체적 작업 내용}

    DONE WHEN:
    - {완료 조건}

    TSO: {must|should} — "{TSO 의중}"

  # ── C1: 델타 포함 ──
  delta_dispatch: |
    [DISPATCH DISP-{session}-{seq}]
    TO: worker-{name}
    FROM: {secretary|ar-manager|worker-{name}}
    ISSUED_BY: {tso_direct|secretary_relay|ar_manager_auto|worker_to_worker}
    PROJECT: {project_id}
    PRIORITY: {urgent|normal|low}
    CONTEXT: C1 (delta)

    SINCE YOUR LAST SESSION:
    - {session-XXX 이후 변경된 결정 1}
    - {session-XXX 이후 변경된 결정 2}

    TASK: {동사로 시작하는 한 줄 요약}

    DESCRIPTION:
    {구체적 작업 내용}

    DONE WHEN:
    - {완료 조건}

    TSO: {must|should} — "{TSO 의중}"
    {RED LINE: "{금지 사항}" — 해당 시만}

  # ── C2: 신규/복귀 Worker 온보딩 ──
  onboarding_dispatch: |
    [DISPATCH DISP-{session}-{seq}]
    TO: worker-{name} (신규|복귀)
    FROM: {secretary|ar-manager|worker-{name}}
    ISSUED_BY: {tso_direct|secretary_relay|ar_manager_auto|worker_to_worker}
    PROJECT: {project_id}
    PRIORITY: {urgent|normal|low}
    CONTEXT: C2 (snapshot)

    PROJECT SNAPSHOT:
    - 프로젝트: {이름 + 한 줄 설명}
    - 완료: {주요 완료 항목들}
    - 진행 중: {현재 진행 중인 것}
    - 대기: {pending 항목}
    - 기술 스택: {스택}

    TASK: {동사로 시작하는 한 줄 요약}

    DESCRIPTION:
    {구체적 작업 내용}

    DONE WHEN:
    - {완료 조건}

    TSO: {must|should} — "{TSO 의중}"
    RESOURCES: {참고 파일 경로}


# ═══════════════════════════════════════════════════════
# 5. 도메인별 라우팅 테이블 (v1.2 추가)
# ═══════════════════════════════════════════════════════
#
# Secretary / AR Manager가 dispatch 대상을 결정할 때 이 테이블을 먼저 참조한다.
# 테이블에 없는 업무 → context 판단 → 판단 불명확 시 TSO 에스컬레이션.

routing_table:

  - domain: "Stock Sentinel"
    keywords: ["stock_sentinel", "텔레그램 알림", "주식 신호", "VIX", "Fear & Greed",
               "내부자 거래", "기관 보유", "차트", "종목", "지수", "환율", "WSB"]
    primary: "worker-sentinel"
    fallback: "worker-engineer"
    fallback_condition: "worker-sentinel 미가동 시"
    note: "~/stock_sentinel/ 관련 모든 작업은 worker-sentinel 전담."

  - domain: "tso_in_the_loop 인프라"
    keywords: ["dispatch_router", "watch_signals", "auto_enter", "permission_gate",
               "org_snapshot", "scripts/", "crontab", "tmux 구조", "CLAUDE.md"]
    primary: "worker-engineer"
    fallback: "worker-architect"
    fallback_condition: "설계 판단이 필요한 경우 architect와 협력"

  - domain: "시스템 설계·아키텍처"
    keywords: ["설계", "구조 개선", "리뷰", "취약점", "프로토콜", "자율 스캔", "PROP-ARCH"]
    primary: "worker-architect"
    fallback: "worker-engineer"
    fallback_condition: "구현이 명확하고 설계 판단 불필요 시"

  - domain: "논문·연구"
    keywords: ["논문", "paper", "ENS", "Somatic Frame", "Context Codec", "선행연구",
               "실험", "ICML", "arXiv", "workshop"]
    primary: "worker-paper"
    fallback: null
    note: "논문 코드 구현이 필요하면 worker-engineer에게 별도 dispatch."

    primary: "worker-growth"
    fallback: null

  - domain: "QA·버그 검증"
    keywords: ["QA", "버그", "BUG-", "테스트", "검증", "유저 관점", "vibe_check"]
    primary: "worker-qa"
    fallback: "worker-engineer"
    fallback_condition: "코드 수정이 필요한 경우"

  - domain: "소설·창작"
    keywords: ["소설", "fiction", "창작", "스토리", "narrative"]
    primary: "worker-writer"
    ownership: "TSO 직접 관할 — Secretary/AR Manager dispatch 금지"

  - domain: "vibe_check 서비스"
    keywords: ["vibe_check", "Railway", "Prisma", "ZK", "투표", "익명"]
    primary: "worker-vibe"
    fallback: "worker-engineer"

routing_rules:
  - "테이블 매칭 시: 키워드 2개 이상 일치하면 해당 도메인으로 라우팅."
  - "worker-to-worker 요청: 수신 Worker가 범위 밖이면 ar_signal_queue로 에스컬레이션."
  - "라우팅 불명확: Secretary가 TSO에게 에스컬레이션 전에 가장 근접한 도메인으로 시도."

# ═══════════════════════════════════════════════════════
# 6. Dispatch 경로 표준 (v1.6 추가 — DEF-20260402-07 해결)
# ═══════════════════════════════════════════════════════
#
# 3개 경로 혼재 문제를 canonical 경로 1개로 해결.

dispatch_paths:

  canonical:
    path: "~/tso_in_the_loop/dispatch_inbox/"
    used_by: "Secretary, AR Manager 발송"
    naming: "disp_{YYYYMMDD_HHMMSS}_{target-role}.yaml"

  worker_to_worker:
    path: "~/tso_in_the_loop/tasks/dispatches/"
    used_by: "Worker → Worker 직접 발송 (Eli→Finn 등)"
    naming: "DISP-{ID}.yaml"
    note: "dispatch_router.sh가 두 경로 모두 폴링함."

  deprecated:
    path: "~/tso_in_the_loop/tasks/dispatches/dispatch_inbox/"
    status: "deprecated — 신규 dispatch 금지. 기존 파일만 유지."

  boot_check_order:
    - "~/tso_in_the_loop/dispatch_inbox/"
    - "~/tso_in_the_loop/tasks/dispatches/"

  # v1.7 추가 — DEF-20260402-03-felix 해결
  priority_rule: |
    dispatch 파일의 status 필드가 구두 메시지(대화, 텍스트)보다 항상 우선한다.
    AR Manager가 "대기"라고 말했더라도 dispatch status가 sent/urgent이면 착수한다.
    충돌 시: dispatch 파일 > 구두 지시 > 추론.

  - "논문 통합 주체: 파편(§별 분할 작업) 완성 후 통합은 worker-paper 담당. AR Manager가 통합 dispatch 발령."
  - "신규 Worker tmux 창 개설: AR Manager 자율 처리. TSO 에스컬레이션 불필요."
  - "worker-qa 트리거: 각 Worker가 자율 판단으로 직접 dispatch 가능 (AR Manager 중계 불필요)."


# ═══════════════════════════════════════════════════════
# 6. Worker 핸드오프 프로토콜 (Fan-in 패턴)
# ═══════════════════════════════════════════════════════
#
# 여러 Worker가 하나의 산출물을 분담 작업할 때 사용.
# 예: ENS-002 논문 §1(worker-paper) + §3(worker-architect) + 실험(worker-engineer)

handoff_protocol:
  pattern: "fan_in"

  worker_responsibility:
    rule: |
      분담 작업 완료 시 Worker는:
      1. 출력물을 합의된 경로에 저장 (통상 tasks/ensemble/{ID}/ 또는 tasks/active/{ID}/)
      2. ar_signal_queue에 DONE 신호 작성 (담당 파트 명시)
    signal_format: |
      [DONE PART — {project_id}/{part_name}]
      산출물: {파일 경로}
      통합 시 유의사항: {W2/통합 담당자를 위한 연결 힌트 — 없으면 생략}

  ar_manager_responsibility:
    rule: |
      AR Manager는 fan-in 진행 상황을 추적한다:
      1. 대기 중인 파편 목록을 ar_signal_queue에서 모니터링
      2. 전체 파편 도착 확인 시 → 통합 담당 Worker에게 통합 dispatch 발령
      3. 일부 파편 지연 시 → 해당 Worker에게 ETA 확인

  integrator_default:
    논문: "worker-paper"
    인프라_빌드: "worker-engineer"
    설계_문서: "worker-architect"
    note: "통합 담당은 dispatch 시 명시. 미명시 시 위 기본값 사용."

  fan_in_dispatch_format: |
    [DISPATCH DISP-{session}-{seq}]
    TO: worker-paper (통합)
    FROM: ar-manager
    ISSUED_BY: ar_manager_auto
    PROJECT: {project_id}
    PRIORITY: normal

    TASK: {파편들} 통합하여 {최종 산출물} 작성

    PARTS RECEIVED:
    - {파트 1}: {파일 경로}
    - {파트 2}: {파일 경로}

    DONE WHEN:
    - {최종 통합 파일 경로}에 저장 완료


# ═══════════════════════════════════════════════════════
# 7. AR Manager 자율 범위 — 역방향 규칙 (Negative List)
# ═══════════════════════════════════════════════════════
#
# AR Manager는 기본적으로 자율 실행한다.
# 아래 에스컬레이션 조건 중 하나라도 해당하면 TSO에게 먼저 확인.
# 이 외 모든 운영 판단은 자율 처리 후 결과만 ar_signal_queue에 보고.

ar_manager_autonomy:
  default: "자율 실행"
  escalation_conditions:
    - id: "ESC-01"
      condition: "외부 서비스로 데이터 전송"
      reason: "개인정보·보안 책임"
      examples: ["Slack webhook 신규 연결", "외부 API에 사용자 데이터 전송"]

    - id: "ESC-02"
      condition: "API 비용 $5 이상 예상되는 작업"
      reason: "비용 통제"
      examples: ["대규모 LLM 실험", "Somatic Frame Exp 전체 실행"]

    - id: "ESC-03"
      condition: "새 외부 계정·서비스 생성"
      reason: "책임 소재 및 계정 관리"

    - id: "ESC-04"
      condition: "기존 Worker 역할 정의 변경 또는 역할 영구 종료"
      reason: "조직 구조 변경은 TSO 권한"
      examples: ["worker-paper 역할 범위 재정의", "worker-qa 역할 삭제"]
      note: "신규 Worker tmux 창 개설 및 신규 역할 파일 생성은 자율 처리 가능."

    - id: "ESC-05"
      condition: "되돌리기 어려운 인프라 조작"
      reason: "안전"
      examples: ["DB 스키마 삭제", "프로덕션 배포 강제 롤백", "crontab 전체 초기화"]

  taxonomy_reference:
    file: "tasks/analysis/change_risk_taxonomy.md"
    note: |
      ESC-01~05는 RED zone의 핵심만 추린 빠른 역방향 참조.
      경계 케이스 판단이 필요할 때는 위 Taxonomy를 참고한다.
      (GREEN/YELLOW/ORANGE/RED 4구역, 가역성×파급범위 2축 매트릭스, 실사례 14건)

  auto_allowed_examples:
    - "신규 Worker tmux 창 개설"
    - "dispatch_protocol.yaml 등 프로토콜 파일 수정"
    - "settings.local.json 권한 추가·수정"
    - "worker-qa dispatch 발령"
    - "fan-in 통합 dispatch 발령"
    - "ar_signal_queue 신호 작성"
    - "기존 crontab 파라미터 수정 (비용 없음)"


# ═══════════════════════════════════════════════════════
# 8. Secretary 체크리스트 (dispatch 전 확인)
# ═══════════════════════════════════════════════════════

preflight_checklist:
  - "[ ] task.title이 동사로 시작하는가?"
  - "[ ] done_when이 체크 가능한 형태인가? ('잘 작동한다' 같은 추상 표현 금지)"
  - "[ ] tso_intent.explicit과 inferred가 혼재하지 않는가? ([추론] 태그 확인)"
  - "[ ] 이번 세션 TSO 발언이 explicit에 반영됐는가?"
  - "[ ] Worker가 이미 알고 있는 context를 중복 포함하지 않았는가? (C1 이하면 생략)"
  - "[ ] out_of_scope가 필요한 상황인가? (범위 침범 이력 있는 Worker에게만)"


# ═══════════════════════════════════════════════════════
# 9. Worker 응답 규약 (dispatch에 대한 Worker의 답변 형식)
# ═══════════════════════════════════════════════════════
#
# Worker도 일관된 형식으로 보고해야 Secretary가 효율적으로 집계 가능.

worker_report_schema:
  ack: |
    [ACK DISP-{id}]
    착수합니다. 예상 완료: {작업량 예측 — 없으면 생략}

  done: |
    [DONE DISP-{id}]
    완료:
    - {완료된 항목 1}
    - {완료된 항목 2}

    미완료/변경:  {없으면 생략}
    - {이유와 대안}

    NEXT: {다음 dispatch 제안 또는 대기}

  blocked: |
    [BLOCKED DISP-{id}]
    블로커: {구체적으로}
    필요한 것: {TSO 결정 | AR Manager 권한 | 다른 Worker 결과물}
    임시 조치: {블로커 해소 전 할 수 있는 것 — 없으면 생략}


# ═══════════════════════════════════════════════════════
# 10. 예외 처리
# ═══════════════════════════════════════════════════════

exceptions:
  tso_direct_message:
    when: "TSO가 Worker에게 직접 말할 때"
    rule: "Secretary는 DISP 없이 전달. 단, 완료 후 Secretary에게 결과 보고는 유지."

  urgent_hotfix:
    when: "Secretary dispatch 없이 즉시 처리가 필요한 긴급 상황"
    rule: "Worker가 자율 착수 가능. 완료 후 [SELF-DISPATCH] 태그로 Secretary에게 보고."
    format: |
      [SELF-DISPATCH]
      이유: {긴급 사유}
      작업: {한 줄}
      결과: {완료된 것}

  ar_manager_override:
    when: "AR Manager가 Worker 재배치·중단·권한 변경 시"
    rule: "DISP ID 대신 [AR-{session}-{seq}] 사용. Secretary에게 사후 통보."


# ═══════════════════════════════════════════════════════
# 11. 규칙 업데이트 전파 스키마 (v1 패치 — session-017)
# ═══════════════════════════════════════════════════════
#
# settings 변경 유형 분류:
#   Type I  : 지시 변경 (CLAUDE.md / 프로토콜 YAML) — 재시작 불필요, 즉시 전파
#   Type II : 권한 확장 (settings.json allow 추가) — 비긴급 자연 재시작
#   Type III: 권한 축소 (settings.json allow 제거) — 긴급 즉시 재시작

rule_update_schema:
  id: "RU-{session}-{seq}"
  from: "secretary"
  to: "ALL | worker-{name}"
  update_type: "I | II | III"
  changed_file: "{파일 경로}"
  change_summary: "{한 줄}"
  apply_timing: "immediate | next_task | after_restart"

  worker_ack:
    format: |
      [ACK RU-{id}]
      재독 완료: {파일명}
      이해: {변경 한 줄}
      영향: 없음 | {구체적 영향}

permission_update_schema:
  id: "PU-{session}-{seq}"
  urgency: "non-critical | critical"
  shutdown_deadline: "현재 task 완료 후 | 5분 이내"
  restart_by: "ar-manager"
  handoff_required: true


# ═══════════════════════════════════════════════════════
# 12. 결정 로그 표준 (v1.5 — ENS-005 판례 원리 적용)
# ═══════════════════════════════════════════════════════

decision_log_standard:
  rule: "모든 ORANGE/RED 결정에 이유 필드 필수"
  format:
    decision: "변경 내용 한 줄"
    reason: "왜 이 결정을 했는가"
    alternatives_considered: ["대안 1", "대안 2"]
    decided_by: "TSO | secretary | ar-manager"
    date: "YYYY-MM-DD"
  scope: "ORANGE/RED zone 결정 + tso_decision_queue 항목 전체"
  changelog: "v1.5 — ENS-005 판례 원리 적용 (2026-04-01, TSO 승인)"


# ═══════════════════════════════════════════════════════
# 13. WIP Limits (v1.6 — Kanban 적용)
# ═══════════════════════════════════════════════════════

wip_limits:
  rule: "동시 진행 작업 수를 구조적으로 제한. 초과 시 새 작업 시작 금지."
  per_worker: 1            # Worker당 active in_progress 최대 1건
  system_total: "N-1"      # N = 활성 Worker 수. 1명분 여유(slack) 항상 확보.
  expedite_global: 1       # 시스템 전체 Expedite 동시 1건만

  enforcement: |
    - dispatch 발령 전 worker_status.json 확인.
    - 해당 Worker가 이미 in_progress면 queue에 넣되 push하지 않는다.
    - Worker가 완료 후 pull (proposed_next 또는 backlog).
    - system_total 초과 시: 가장 낮은 priority 작업을 suspend 후 queue로.

  slack_principle: |
    20% 여유 = 블로커 해소 + 품질 유지 + 긴급 대응 버퍼.
    100% 가동률은 처리량을 죽인다. (Kanban Zone; Scrum.org)

  changelog: "v1.6 — Elliot 조사(mgmt_framework_synthesis.md) 기반. TSO 승인 2026-04-04."


# ═══════════════════════════════════════════════════════
# 14. Classes of Service (v1.6 — Kanban CoS 적용)
# ═══════════════════════════════════════════════════════

classes_of_service:
  rule: "모든 dispatch를 3개 서비스 등급으로 분류. 등급별 처리 규칙이 다르다."

  expedite:
    trigger: "TSO '지금 당장' 지시"
    wip: 1                  # 시스템 전체 동시 1건만
    behavior: |
      - Worker의 현재 작업을 suspend 가능 (state 저장 후)
      - 다른 모든 Standard를 우선하여 즉시 착수
      - Expedite 2건 동시 발생 시 → TSO에게 에스컬레이션: "둘 중 무엇이 진짜 긴급한가?"
    sla: "15분 내 착수"
    mapping: "TSO가 '지금 당장'을 명시한 경우만. P0이라도 Marcus 자율 발령이면 Standard."

  standard:
    trigger: "일반 P1~P2 dispatch"
    wip: "per_worker limit 내"
    behavior: |
      - FIFO + 라우팅 테이블(§5) 기반 할당
      - WIP limit 내에서만 할당. 초과 시 queue 대기.
      - Worker 완료 후 다음 Standard를 pull.
    sla: "2시간 내 착수"
    mapping: "priority P1, P2"

  intangible:
    trigger: "P3 + backlog pull"
    wip: "제한 없음 (slack 활용)"
    behavior: |
      - 유휴 시에만 pull. 절대 Standard를 밀어내지 않음.
      - Worker 자율 선택 (backlog.yaml에서).
      - SLA 없음 — 여유 있을 때 수행.
    sla: "없음"
    mapping: "priority P3 + tasks/backlog.yaml"

  changelog: "v1.6 — Kanban CoS 4등급 → 3등급 단순화 (Fixed Date 제외, 이 시스템에 불필요). TSO 승인 2026-04-04."


# ═══════════════════════════════════════════════════════
# 15. Stale Dispatch 행동 프로토콜 (v1.6)
# ═══════════════════════════════════════════════════════

stale_protocol:
  rule: "dispatch가 일정 시간 내 ACK(착수) 되지 않으면 단계적으로 대응."

  stages:
    - stage: 1
      trigger: "sent → 2h ACK 없음"
      action: |
        Worker 세션 상태 확인 (tmux 살아있는지).
        - 세션 alive → 리마인드 발송 (ar_signal_queue fyi)
        - 세션 dead → 재시작 시도
      actor: "ar-manager-marcus (자동 또는 수동)"

    - stage: 2
      trigger: "리마인드 후 1h 추가 미응답"
      action: |
        2차 리마인드 + Worker ctx_pct 확인.
        - ctx_pct < 30% → 재시작 필요 판단
        - ctx_pct >= 30% → 세션 내 문제 (blocked 등) 조사
      actor: "ar-manager-marcus"

    - stage: 3
      trigger: "2차 리마인드 후 1h 추가 미응답 (총 4h stale)"
      action: |
        자동 재발령: 동일 dispatch를 대체 Worker에게 발령.
        원래 Worker의 dispatch status → "reassigned"
        재발령 시 worker_skills.yaml 참조하여 적합 Worker 선택.
      actor: "ar-manager-marcus (자율 판단)"

  watchdog_integration: |
    worker_watchdog.sh의 stale dispatch 감지 (STALE_THRESHOLD=3600)와 연동.
    watchdog는 감지만, 행동은 Marcus가 위 stages에 따라.
    watchdog alert → Marcus 확인 → stage 1~3 순차 실행.

  exception: |
    - Intangible(P3/backlog)는 stale 프로토콜 적용 안 함.
    - Worker가 명시적으로 "[BLOCKED DISP-XXX]" 보고한 경우 stale 아닌 blocked 처리.

  changelog: "v1.6 — 기존 watchdog stale 감지에 행동 프로토콜 추가. 경고 무한 누적 → 3단계 행동 전환. TSO 승인 2026-04-04."


# ═══════════════════════════════════════════════════════
# 16. Task Sizing & Time Tracking (v1.8)
# ═══════════════════════════════════════════════════════
#
# 목적: dispatch 발행 시 업무 크기를 추정하고, 실제 소요 시간을 추적하여
#       (1) Worker별 처리 속도 파악 (2) nudge 타이밍 자동 산출 (3) 유휴 vs 작업중 정확 구분
#
# 이 흐름은 AR Manager(Marcus)가 직접 관장한다.

task_sizing:

  size_definitions:
    S:
      description: "단순 수정, 설정 변경, 1파일 편집"
      expected_hours: 1
      examples: ["config 수정", "버그 1건 패치", "필드 추가", "standing task 1건"]
    M:
      description: "스크립트 구현, 분석 리포트, 중간 규모 작업"
      expected_hours: 3
      examples: ["신규 스크립트 작성", "QA 검증 1세트", "프레임워크 조사", "대시보드 탭 추가"]
    L:
      description: "설계+구현, 통합 작업, 다파일 수정"
      expected_hours: 6
      examples: ["이벤트 드리븐 Phase 구현", "논문 섹션 초안", "대규모 리팩토링"]
    XL:
      description: "대규모 연구, 아키텍처 전환, 장기 프로젝트"
      expected_hours: 12
      examples: ["시스템 전면 재설계", "논문 전체 통합", "신규 서비스 구축"]

  nudge_policy:
    rule: "expected_hours × 1.5 경과 시 AR Manager에게 자동 알림"
    thresholds:
      S: "1.5h 경과 → nudge"
      M: "4.5h 경과 → nudge"
      L: "9h 경과 → nudge"
      XL: "18h 경과 → nudge"
    action: |
      1. Worker 세션 상태 확인 (alive? working? idle? stuck on permission?)
      2. 상태에 따라: 리마인드 / 재시작 / 재배정 (stale_protocol §15와 연동)
      3. 반복 지연 Worker → velocity 프로파일에 기록

  worker_velocity:
    description: "Worker별 실제 처리 속도 누적 기록. 배정 판단 시 참고."
    storage: "tasks/metrics/worker_velocity.yaml"
    schema: |
      worker-engineer-kai:
        completed: 17
        avg_ratio: 0.85   # actual / expected (1.0 = 정확, <1.0 = 빠름, >1.0 = 느림)
        size_breakdown:
          S: { count: 8, avg_hours: 0.7 }
          M: { count: 6, avg_hours: 2.5 }
          L: { count: 3, avg_hours: 5.0 }
    update_trigger: "dispatch 완료(DONE) 시 자동 갱신"

  worker_responsibility: |
    Worker는 dispatch ACK 시 started_at을, DONE 시 completed_at을 기록한다.
    기존 worker_report_schema(§9)의 ACK/DONE 형식에 통합:
      [ACK DISP-{id}]
      started_at: "2026-04-07T10:00:00"

      [DONE DISP-{id}]
      completed_at: "2026-04-07T13:00:00"

  ar_manager_responsibility: |
    1. 모든 dispatch 발행 시 size 필드 필수 기입 (Marcus 판단).
    2. nudge 알림 수신 시 즉시 Worker 상태 확인.
    3. 주간 1회 worker_velocity.yaml 갱신 + 배정 전략 조정.
    4. 예상 대비 2배 이상 초과 패턴 → 원인 분석 (업무 난이도 오판? Worker 역량? 외부 블로커?)

  changelog: "v1.8 — TSO 지시 (2026-04-07). 업무 사이즈 추정 + 시간 추적 + nudge 자동화. Marcus 직접 관장."


# ═══════════════════════════════════════════════════════
# §17. Model Tier (권장 모델)
# ═══════════════════════════════════════════════════════

model_tier:

  description: |
    dispatch 발행 시 Worker에게 권장하는 모델 등급.
    Worker가 부팅 시 참고하되 강제는 아님 (recommend only).
    TSO가 /model로 직접 관리하는 기존 체계를 유지한다.

  values:
    opus:
      when: "설계 결정, 아키텍처 리뷰, 복잡한 분석, 논문 작성, 다파일 리팩토링"
      typical_size: "L, XL"
    sonnet:
      when: "스크립트 구현, 버그 수정, QA 검증, 문서 갱신, 일반 엔지니어링"
      typical_size: "S, M"
    haiku:
      when: "파일 조회, 간단한 설정 변경, 상태 확인, 메타데이터 갱신"
      typical_size: "S"

  size_default_mapping:
    S: "sonnet"
    M: "sonnet"
    L: "opus"
    XL: "opus"

  rules:
    - "model_tier가 null이면 발행자 판단에 맡긴다 (하위 호환)."
    - "Worker는 model_tier를 참고하되, 세션 중 필요에 따라 자유롭게 변경 가능."
    - "model_tier는 dispatch 발행 시 size와 함께 AR Manager가 판단."
    - "TSO가 직접 /model로 지정한 경우 그것이 우선."

  worker_behavior: |
    부팅 또는 dispatch ACK 시:
